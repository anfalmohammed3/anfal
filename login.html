 <!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل | مدونة أثر</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container">

        <h1 class="logo">أثر</h1>
        <p class="tagline">الكلمة أثر يبقى</p>

        <nav class="navbar">
            <a href="index.html">الرئيسية</a>
            <a href="article.html">المقالات</a>
            <a href="text.html">النصوص</a>
            <a href="login.html" class="active">التسجيل</a>
            <a href="contact.html">تواصل معنا</a>
        </nav>

    </div>
</header>

<main>

    <div class="form-container">

        <h2>إنشاء حساب جديد</h2>

        <form id="registerForm">

            <label for="name">الاسم الكامل</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="أدخل اسمك"
                required
            >

            <label for="email">البريد الإلكتروني</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                required
            >

            <label for="phone">رقم الهاتف</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="أدخل رقم هاتفك"
                required
            >

            <label for="gender">الجنس</label>
            <select id="gender" name="gender" required>
                <option value="">اختر الجنس</option>
                <option value="male">ذكر</option>
                <option value="female">أنثى</option>
            </select>

            <label for="password">كلمة المرور</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="أدخل كلمة المرور"
                minlength="6"
                required
            >

            <label for="confirmPassword">تأكيد كلمة المرور</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="أعد كتابة كلمة المرور"
                minlength="6"
                required
            >

            <button type="submit">إنشاء الحساب</button>

        </form>

        <p id="registerMessage"></p>

    </div>

</main>

<footer class="footer">
    <p>جميع الحقوق محفوظة © 2026 | مدونة أثر</p>
</footer>

<script src="script.js"></script>

</body>
</html>
